services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ev_user
      POSTGRES_PASSWORD: ev_pass
      POSTGRES_DB: ev_battery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev_user -d ev_battery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
